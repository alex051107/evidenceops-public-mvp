<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">EvidenceOps evidence-to-release workflow</title>
  <desc id="desc">A source-bound workflow from public or synthetic documents through citation-preserving parsing, retrieval, extraction, risk checks, evaluation, and a static evidence console. Unsupported retrieval remains an explicit outcome.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263532"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B85C45"/>
    </marker>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .eyebrow { font-size: 17px; font-weight: 700; letter-spacing: 2.6px; fill: #2A7F78; }
      .title { font-size: 46px; font-weight: 700; fill: #182321; }
      .subtitle { font-size: 21px; fill: #53615E; }
      .stage-no { font-size: 16px; font-weight: 700; letter-spacing: 1.4px; fill: #2A7F78; }
      .stage-title { font-size: 25px; font-weight: 700; fill: #182321; }
      .body { font-size: 18px; fill: #475552; }
      .small { font-size: 16px; fill: #5D6966; }
      .direct { font-size: 16px; font-weight: 700; fill: #263532; }
      .warn { font-size: 17px; font-weight: 700; fill: #9D4936; }
      .trace { font-size: 16px; font-weight: 700; fill: #725A28; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FBFBF8"/>
  <rect x="55" y="45" width="1490" height="810" rx="24" fill="#FFFFFF" stroke="#D5D8D0" stroke-width="2"/>

  <g class="sans">
    <text x="105" y="108" class="eyebrow">EVIDENCEOPS / PUBLIC MVP</text>
    <text x="105" y="168" class="title">From a source document to a claim that can be inspected.</text>
    <text x="105" y="209" class="subtitle">Every transformation preserves a locator; every unsupported route stays visible.</text>

    <line x1="258" y1="405" x2="1325" y2="405" stroke="#263532" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(95 300)">
      <rect width="205" height="210" rx="17" fill="#EDF4F1" stroke="#2A7F78" stroke-width="2"/>
      <text x="20" y="35" class="stage-no">01 / SOURCE</text>
      <text x="20" y="78" class="stage-title">Register</text>
      <text x="20" y="112" class="body">Public source</text>
      <text x="20" y="140" class="body">or synthetic fixture</text>
      <line x1="20" y1="162" x2="185" y2="162" stroke="#AFC9C2"/>
      <text x="20" y="190" class="small">URL · licence · use</text>
    </g>

    <g transform="translate(345 300)">
      <rect width="205" height="210" rx="17" fill="#F6F4EC" stroke="#B88732" stroke-width="2"/>
      <text x="20" y="35" class="stage-no" fill="#8A6625">02 / STRUCTURE</text>
      <text x="20" y="78" class="stage-title">Parse + chunk</text>
      <text x="20" y="112" class="body">Keep section path</text>
      <text x="20" y="140" class="body">and source offsets</text>
      <line x1="20" y1="162" x2="185" y2="162" stroke="#D3C294"/>
      <text x="20" y="190" class="small">citation on every chunk</text>
    </g>

    <g transform="translate(595 300)">
      <rect width="205" height="210" rx="17" fill="#EDF4F1" stroke="#2A7F78" stroke-width="2"/>
      <text x="20" y="35" class="stage-no">03 / FIND</text>
      <text x="20" y="78" class="stage-title">Retrieve</text>
      <text x="20" y="112" class="body">Rank evidence</text>
      <text x="20" y="140" class="body">chunks, not answers</text>
      <line x1="20" y1="162" x2="185" y2="162" stroke="#AFC9C2"/>
      <text x="20" y="190" class="small">top-k + citation</text>
    </g>

    <g transform="translate(845 300)">
      <rect width="205" height="210" rx="17" fill="#F6F4EC" stroke="#B88732" stroke-width="2"/>
      <text x="20" y="35" class="stage-no" fill="#8A6625">04 / CLAIM</text>
      <text x="20" y="78" class="stage-title">Extract</text>
      <text x="20" y="112" class="body">Small typed fields</text>
      <text x="20" y="140" class="body">with exact spans</text>
      <line x1="20" y1="162" x2="185" y2="162" stroke="#D3C294"/>
      <text x="20" y="190" class="small">field → evidence span</text>
    </g>

    <g transform="translate(1095 300)">
      <rect width="205" height="210" rx="17" fill="#F2F3EF" stroke="#687572" stroke-width="2"/>
      <text x="20" y="35" class="stage-no" fill="#56625F">05 / GATE</text>
      <text x="20" y="78" class="stage-title">Risk check</text>
      <text x="20" y="112" class="body">Citation present?</text>
      <text x="20" y="140" class="body">Use allowed?</text>
      <line x1="20" y1="162" x2="185" y2="162" stroke="#C5CBC6"/>
      <text x="20" y="190" class="small">continue or abstain</text>
    </g>

    <g transform="translate(1340 300)">
      <rect width="170" height="210" rx="17" fill="#E9F1F4" stroke="#4B7787" stroke-width="2"/>
      <text x="20" y="35" class="stage-no" fill="#4B7787">06 / RELEASE</text>
      <text x="20" y="78" class="stage-title">Inspect</text>
      <text x="20" y="112" class="body">Eval summary</text>
      <text x="20" y="140" class="body">+ console</text>
      <line x1="20" y1="162" x2="150" y2="162" stroke="#B8CDD4"/>
      <text x="20" y="190" class="small">scoped receipt</text>
    </g>

    <path d="M 697 510 C 697 585, 595 585, 595 650" fill="none" stroke="#B85C45" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow-warn)"/>
    <rect x="455" y="650" width="280" height="96" rx="16" fill="#FFF2ED" stroke="#B85C45" stroke-width="2"/>
    <text x="485" y="691" class="warn">UNSUPPORTED</text>
    <text x="485" y="722" class="body">No matching evidence → no claim</text>

    <path d="M 1198 510 C 1198 585, 1300 585, 1300 650" fill="none" stroke="#B85C45" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow-warn)"/>
    <rect x="1160" y="650" width="280" height="96" rx="16" fill="#FFF2ED" stroke="#B85C45" stroke-width="2"/>
    <text x="1190" y="691" class="warn">ABSTAIN / REVIEW</text>
    <text x="1190" y="722" class="body">Risk remains attached to output</text>

    <rect x="95" y="785" width="1415" height="42" rx="12" fill="#F6F4EC"/>
    <text x="120" y="812" class="trace">TRACE CHAIN</text>
    <text x="265" y="812" class="small">source_id → document_id → chunk_id → evidence span → risk report → scoped release artifact</text>

    <text x="1060" y="255" class="direct">Solid line: supported route</text>
    <line x1="1290" y1="249" x2="1355" y2="249" stroke="#263532" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1380" y="255" class="warn">Dashed: stop</text>
  </g>
</svg>
